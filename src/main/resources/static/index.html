<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
</head>
<body>
    <h1>Speech to Text</h1>
    <p>
        Record your voice and convert it to text.
    </p>
    <button id="startButton">
        Start Recording
    </button>
    <button id="stopButton" disabled>
        Stop Recording
    </button>
    <p id="status" aria-live="polite">
        Ready to record
    </p>
    <h2>Transcription</h2>
    <p id="transcription"
       aria-live="polite">
        Your transcription will appear here.
    </p>
    <script src="script.js"></script>
</body>
</html>
