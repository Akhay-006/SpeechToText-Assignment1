<!DOCTYPE html>
<html>

<head>
    <title>Speech to Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 15px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #startButton {
            background-color: #333;
            color: white;
        }

        #transcription {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            min-height: 50px;
        }
    </style>

</head>

<body>

    <h1> 🎙️Speech to Text 📄</h1>

    <p>Speak and turn your voice into text.</p>

    <button id="startButton">Start Recording</button>

    <button id="stopButton" disabled>Stop Recording</button>

    <p id="status">Ready to record</p>

    <h2>Transcription</h2>

    <p id="transcription">
        Your transcription will appear here once it's ready.
    </p>

    <script src="script.js"></script>

</body>

</html>
